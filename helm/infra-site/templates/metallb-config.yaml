{{- if .Values.metallb.enabled }}
apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.metallb.poolName }}
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
spec:
  autoAssign: false
  addresses:
    {{- range .Values.metallb.addresses }}
    - {{ . | quote }}
    {{- end }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.metallb.poolName }}
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
spec:
  ipAddressPools:
    - {{ .Values.metallb.poolName }}
{{- end }}
