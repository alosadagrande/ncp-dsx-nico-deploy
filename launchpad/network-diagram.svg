<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760"
     font-family="ui-monospace,SFMono-Regular,'Courier New',monospace">

  <!-- Background -->
  <rect width="900" height="760" fill="#F8FAFC" rx="6"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">
    NICo Site Network — control-plane-3 · tray-6 · tray-7
  </text>

  <!-- ─────────────────────────────────────────────
       CSL SWITCHES  (top center)
       ───────────────────────────────────────────── -->
  <rect x="220" y="48" width="460" height="90" rx="6" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="white">sn5600-csl-01 / sn5600-csl-02</text>
  <text x="450" y="89" text-anchor="middle" font-size="10" fill="#93C5FD">Collapsed Spine-Leaf · Cumulus Linux (NVUE)</text>

  <!-- port labels inside CSL -->
  <rect x="265" y="101" width="130" height="26" rx="3" fill="#1E40AF" opacity="0.6"/>
  <text x="330" y="112" text-anchor="middle" font-size="8" fill="#BFDBFE">swp16s1</text>
  <text x="330" y="123" text-anchor="middle" font-size="8" fill="#93C5FD">SNO trunk · VLAN 210,212</text>

  <rect x="505" y="101" width="130" height="26" rx="3" fill="#166534" opacity="0.6"/>
  <text x="570" y="112" text-anchor="middle" font-size="8" fill="#86EFAC">swp3s1 (tray-6)</text>
  <text x="570" y="123" text-anchor="middle" font-size="8" fill="#86EFAC">swp4s0 (tray-7) · VLAN 210</text>

  <!-- ─────────────────────────────────────────────
       control-plane-3 / SNO  (left middle)
       ───────────────────────────────────────────── -->
  <rect x="18" y="225" width="235" height="225" rx="6" fill="#14532D" stroke="#10B981" stroke-width="2"/>
  <text x="135" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="white">control-plane-3</text>
  <text x="135" y="265" text-anchor="middle" font-size="10" fill="#86EFAC">SNO OpenShift · nico-system ns</text>
  <line x1="28" y1="272" x2="244" y2="272" stroke="#166534" stroke-width="1"/>

  <text x="32" y="287" font-size="9" fill="#9CA3AF">bond-ns      →  172.16.3.x</text>
  <text x="32" y="304" font-size="9" fill="#60A5FA">bond-ns.210  →  172.16.10.2/24</text>
  <text x="32" y="321" font-size="9" fill="#FCD34D">bond-ns.211  →  172.16.11.2/24</text>
  <text x="32" y="338" font-size="9" fill="#34D399">bond-ns.212  →  172.16.12.2/24</text>

  <!-- MetalLB VIP sub-box -->
  <rect x="28" y="350" width="215" height="88" rx="4" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="135" y="367" text-anchor="middle" font-size="9" font-weight="bold" fill="#93C5FD">MetalLB L2 VIP: 172.16.10.10</text>
  <text x="135" y="383" text-anchor="middle" font-size="8" fill="#BFDBFE">DHCP   :67/68</text>
  <text x="135" y="397" text-anchor="middle" font-size="8" fill="#BFDBFE">DNS    :53 → :5353</text>
  <text x="135" y="411" text-anchor="middle" font-size="8" fill="#BFDBFE">PXE    :69  · SSH :22 → :2222</text>
  <text x="135" y="425" text-anchor="middle" font-size="8" fill="#BFDBFE">gRPC   :443</text>

  <!-- ─────────────────────────────────────────────
       compute-tray-6  (right, upper)
       ───────────────────────────────────────────── -->
  <rect x="615" y="208" width="265" height="150" rx="6" fill="#3B1764" stroke="#8B5CF6" stroke-width="2"/>
  <text x="748" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="white">compute-tray-6</text>
  <text x="748" y="247" text-anchor="middle" font-size="9" fill="#C4B5FD">BlueField B24 DPU</text>
  <line x1="625" y1="253" x2="870" y2="253" stroke="#4C1D95" stroke-width="1"/>

  <text x="628" y="267" font-size="8" fill="#DDD6FE">DPU B3420 p0  (boot NIC → VLAN 210)</text>
  <text x="628" y="281" font-size="8" fill="#60A5FA">  MAC  e0:9d:73:87:03:70</text>
  <text x="628" y="295" font-size="8" fill="#60A5FA">  DHCP reservation → 172.16.10.101</text>
  <text x="628" y="313" font-size="8" fill="#DDD6FE">Tray BMC (AMI MegaRAC → VLAN 211)</text>
  <text x="628" y="327" font-size="8" fill="#FDE68A">  MAC  18:3d:2d:9b:b3:f4  (sw-01 swp34)</text>
  <text x="628" y="341" font-size="8" fill="#FDE68A">  DPU BMC  e0:9d:73:87:03:85  (sw-02 swp34)</text>

  <!-- ─────────────────────────────────────────────
       compute-tray-7  (right, lower)
       ───────────────────────────────────────────── -->
  <rect x="615" y="390" width="265" height="150" rx="6" fill="#3B1764" stroke="#8B5CF6" stroke-width="2"/>
  <text x="748" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="white">compute-tray-7</text>
  <text x="748" y="429" text-anchor="middle" font-size="9" fill="#C4B5FD">BlueField B24 DPU</text>
  <line x1="625" y1="435" x2="870" y2="435" stroke="#4C1D95" stroke-width="1"/>

  <text x="628" y="449" font-size="8" fill="#DDD6FE">DPU B3420 p0  (boot NIC → VLAN 210)</text>
  <text x="628" y="463" font-size="8" fill="#60A5FA">  MAC  e0:9d:73:86:d4:52</text>
  <text x="628" y="477" font-size="8" fill="#60A5FA">  DHCP reservation → 172.16.10.102</text>
  <text x="628" y="495" font-size="8" fill="#DDD6FE">Tray BMC (AMI MegaRAC → VLAN 211)</text>
  <text x="628" y="509" font-size="8" fill="#FDE68A">  MAC  18:3d:2d:9b:b4:12  (sw-01 swp35)</text>
  <text x="628" y="523" font-size="8" fill="#FDE68A">  DPU BMC  e0:9d:73:86:d4:67  (sw-02 swp35)</text>

  <!-- ─────────────────────────────────────────────
       DC MANAGEMENT SWITCHES  (bottom center)
       ───────────────────────────────────────────── -->
  <rect x="155" y="582" width="590" height="95" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
  <text x="450" y="604" text-anchor="middle" font-size="12" font-weight="bold" fill="white">sn2201dc-mgmt-sw-01  ·  sn2201dc-mgmt-sw-02</text>
  <text x="450" y="621" text-anchor="middle" font-size="10" fill="#FCD34D">BMC Network · VLAN 211 · 172.16.11.0/24</text>
  <line x1="450" y1="627" x2="450" y2="677" stroke="#92400E" stroke-width="1"/>
  <text x="295" y="640" text-anchor="middle" font-size="8" fill="#FDE68A">sw-01: swp34 (tray-6 BMC) · swp35 (tray-7 BMC)</text>
  <text x="620" y="640" text-anchor="middle" font-size="8" fill="#FDE68A">sw-02: swp34/35 DPU BMC · swp6/7 host OOB</text>
  <text x="295" y="657" text-anchor="middle" font-size="8" fill="#D97706">172.16.2.x DHCP → BMC gets IP on boot</text>
  <text x="620" y="657" text-anchor="middle" font-size="8" fill="#D97706">NICo registers BMC IP + credentials (one-time)</text>
  <text x="450" y="672" text-anchor="middle" font-size="8" fill="#F59E0B">SVI vlan211 → 172.16.11.1/24  (gateway)</text>

  <!-- ─────────────────────────────────────────────
       CONNECTION LINES
       ───────────────────────────────────────────── -->

  <!-- SNO → CSL  (gray = existing bond, blue = + VLAN 210/212 trunk) -->
  <line x1="120" y1="225" x2="300" y2="138" stroke="#4B5563" stroke-width="3"/>
  <line x1="130" y1="225" x2="310" y2="138" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.9"/>

  <!-- SNO trunk label -->
  <text font-size="8" fill="#6B7280">
    <textPath href="#path-sno-csl">
      ens3f0np0 (LACP)
    </textPath>
  </text>
  <defs>
    <path id="path-sno-csl" d="M120,225 L300,138"/>
  </defs>
  <!-- inline label instead -->
  <text x="178" y="196" text-anchor="middle" font-size="8" fill="#6B7280" transform="rotate(-30,178,196)">ens3f0np0 (LACP bond)</text>
  <text x="210" y="178" text-anchor="middle" font-size="8" fill="#3B82F6" transform="rotate(-30,210,178)">+ VLAN 210, 212</text>

  <!-- tray-6 → CSL  (VLAN 210, solid blue) -->
  <line x1="666" y1="208" x2="576" y2="138" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="634" y="168" text-anchor="middle" font-size="8" fill="#3B82F6" transform="rotate(-38,634,168)">swp3s1 · VLAN 210</text>

  <!-- tray-7 → CSL  (VLAN 210, dashed blue — second link) -->
  <line x1="700" y1="390" x2="610" y2="138" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="680" y="268" text-anchor="middle" font-size="8" fill="#3B82F6" transform="rotate(-74,680,268)">swp4s0 · VLAN 210</text>

  <!-- tray-6 BMC → DC mgmt switches  (VLAN 211, amber) -->
  <line x1="680" y1="358" x2="440" y2="582" stroke="#F59E0B" stroke-width="2"/>
  <text x="590" y="495" text-anchor="middle" font-size="8" fill="#F59E0B" transform="rotate(-53,590,495)">VLAN 211 (BMC)</text>

  <!-- tray-7 BMC → DC mgmt switches  (VLAN 211, amber dashed) -->
  <line x1="730" y1="540" x2="560" y2="582" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="660" y="567" text-anchor="middle" font-size="8" fill="#F59E0B" transform="rotate(-14,660,567)">VLAN 211 (BMC)</text>

  <!-- Post-provision annotation on CSL (VLAN 212 arrow hint) -->
  <text x="570" y="145" font-size="7" fill="#34D399">→ VLAN 212 after provision</text>

  <!-- ─────────────────────────────────────────────
       LEGEND  (bottom left)
       ───────────────────────────────────────────── -->
  <rect x="18" y="688" width="340" height="62" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="188" y="704" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E293B">Legend</text>

  <line x1="32" y1="717" x2="72" y2="717" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="80" y="721" font-size="9" fill="#1E293B">VLAN 210 — Provisioning  172.16.10.0/24</text>

  <line x1="32" y1="733" x2="72" y2="733" stroke="#F59E0B" stroke-width="2"/>
  <text x="80" y="737" font-size="9" fill="#1E293B">VLAN 211 — BMC Isolated  172.16.11.0/24</text>

  <!-- VLAN 212 workload note -->
  <rect x="370" y="688" width="250" height="62" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="495" y="704" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">VLAN 212 — Workload  172.16.12.0/24</text>
  <text x="495" y="720" text-anchor="middle" font-size="8" fill="#6B7280">Activated after provisioning completes.</text>
  <text x="495" y="734" text-anchor="middle" font-size="8" fill="#6B7280">swp3s1/swp4s0 move from VLAN 210 → 212.</text>

  <!-- Existing network note -->
  <rect x="638" y="688" width="244" height="62" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="760" y="704" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Existing (unchanged)</text>
  <text x="760" y="720" text-anchor="middle" font-size="8" fill="#6B7280">172.16.2.x — shared OOB / BMC DHCP</text>
  <text x="760" y="734" text-anchor="middle" font-size="8" fill="#6B7280">172.16.3.x — north-south data plane</text>

</svg>
